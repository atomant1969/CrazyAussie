<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crazy Aussie Checklist</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --panel: #ffffff;
      --ink: #1e252b;
      --muted: #66717a;
      --line: #d8d2c8;
      --accent: #116466;
      --accent-2: #d8643a;
      --done: #e5f3ee;
      --shadow: 0 10px 25px rgba(40, 38, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(247, 244, 238, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .header-inner,
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      padding: 18px 0 14px;
      display: grid;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      letter-spacing: 0;
    }

    .topline {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    a,
    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    a:hover {
      text-decoration: underline;
    }

    button,
    .file-label {
      min-height: 38px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 7px 11px;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: none;
    }

    button:hover,
    .file-label:hover {
      border-color: var(--accent);
    }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .danger {
      border-color: #b84b3f;
      color: #8f2f26;
    }

    .tools {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }

    #search {
      min-height: 38px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: white;
      color: var(--ink);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    main {
      padding: 22px 0 60px;
      display: grid;
      gap: 16px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric,
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 14px;
    }

    .metric strong {
      display: block;
      font-size: 1.4rem;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: #ebe5dc;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 160ms ease;
    }

    section {
      overflow: hidden;
    }

    .section-head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      background: #fbfaf7;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      text-align: left;
    }

    .section-title {
      display: grid;
      gap: 2px;
    }

    .section-title strong {
      font-size: 1.03rem;
    }

    .section-title span,
    .section-count {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .items {
      display: grid;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 12px 16px;
      border-bottom: 1px solid #eee8df;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item.done {
      background: var(--done);
    }

    .item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .task-main {
      display: grid;
      gap: 8px;
    }

    .task-text {
      font-weight: 560;
    }

    textarea {
      width: 100%;
      min-height: 38px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      background: #fffdf9;
    }

    .tag {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      padding-top: 3px;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
    }

    #importFile {
      display: none;
    }

    @media (max-width: 820px) {
      .tools {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .item {
        grid-template-columns: auto 1fr;
      }

      .tag {
        grid-column: 2;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="topline">
        <div>
          <h1>Crazy Aussie Checklist</h1>
          <div class="nav">
            <a href="Index.md">Index</a>
            <a href="CHECKLIST.md">Markdown Checklist</a>
            <a href="PROJECT_PLAN.md">Project Plan</a>
          </div>
        </div>
        <div class="filters" aria-label="Checklist filters">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="open" aria-pressed="false">Open</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
      </div>
      <div class="tools">
        <input id="search" type="search" placeholder="Search tasks, phases, notes..." autocomplete="off">
        <button type="button" id="exportBtn" class="primary">Export Progress</button>
        <label for="importFile" class="file-label">Import Progress</label>
        <input id="importFile" type="file" accept="application/json">
        <button type="button" id="resetBtn" class="danger">Reset</button>
      </div>
    </div>
  </header>

  <main>
    <div class="summary" aria-label="Progress summary">
      <div class="metric"><strong id="doneCount">0</strong><span>completed</span></div>
      <div class="metric"><strong id="openCount">0</strong><span>open</span></div>
      <div class="metric"><strong id="totalCount">0</strong><span>total tasks</span></div>
      <div class="metric"><strong id="percentCount">0%</strong><span>progress</span></div>
    </div>
    <div class="progress" aria-label="Overall progress"><div id="progressBar"></div></div>
    <div id="sections"></div>
    <div id="empty" class="empty hidden">No tasks match the current filter.</div>
  </main>

  <script>
    const STORAGE_KEY = "crazy-aussie-checklist-v1";
    const SCROLL_KEY = "crazy-aussie-checklist-scroll-v1";

    const checklist = [
      {
        title: "Phase 0: Foundation",
        description: "Set up the core channel, workflow, and reusable planning assets.",
        tasks: [
          "Confirm final channel name spelling.",
          "Write one-sentence channel description.",
          "Write 100-word About page copy.",
          "Create channel banner concept.",
          "Create profile image concept.",
          "Decide whether Shorts or 10-minute tutorials are the primary launch format.",
          "Confirm Android phone recording workflow.",
          "Define minimum Android phone specs for beginner YouTubers.",
          "Confirm computer editing workflow.",
          "Confirm Android-to-PC transfer method.",
          "Choose first editing software to review.",
          "Choose first 5 editing apps/software tools to test.",
          "Choose primary microphone setup if speaking to camera.",
          "Create folder structure for raw footage, edits, thumbnails, and exports.",
          "Create a reusable editing review template.",
          "Create a reusable tutorial outline template.",
          "Create a reusable lead-in/content/lead-out structure from VIDEO_STRUCTURE.md.",
          "Use BEGINNER_YOUTUBE_CURRICULUM.md to expand each beginner video before scripting.",
          "Create a reusable upload checklist.",
          "Create a simple analytics tracker.",
          "Decide whether sponsorships/affiliate links should be planned before YPP."
        ]
      },
      {
        title: "Phase 1: First Lead-Generation Videos",
        description: "Draft the first beginner path from Android phone to upload.",
        tasks: [
          "Draft Video 1: How to Start YouTubing With Only an Android Phone.",
          "Draft Video 2: Minimum Android Phone Specs for Recording YouTube Videos.",
          "Draft Video 3: How to Set Up Your Android Phone Before Recording.",
          "Draft Video 4: How to Record Your First YouTube Video on Android.",
          "Draft Video 5: How to Transfer Videos From Android to a PC.",
          "Draft Video 6: How to Organize Phone Footage on Your PC.",
          "Draft Video 7: Best Free Editing Software for New YouTubers.",
          "Draft Video 8: How to Make Your First YouTube Video Edit.",
          "Draft Video 9: How to Export a YouTube Video Correctly.",
          "Draft Video 10: How to Upload Your First YouTube Video.",
          "Draft Video 11: How to Choose the Thumbnail That Shows in the YouTube Video List.",
          "Draft Video 12: How to Make a Short From a Long Video.",
          "Draft Video 13: My 3-Month Plan to Reach 50k Subscribers.",
          "Draft Video 14: Why This Channel Starts With YouTube Basics Before the Siberian Build.",
          "Draft planning tutorial: Plan Your YouTube Channel Before You Upload.",
          "Draft planning tutorial: Build a YouTube Channel Checklist.",
          "Draft planning tutorial: Create a Project Index for Your Channel Plan.",
          "Draft planning tutorial: Choose Direct AdSense Or MCN.",
          "Review MICRO_TIPS_AND_SCRIPT_INSERTS.md before recording each beginner tutorial."
        ]
      },
      {
        title: "Phase 2: Production Workflow",
        description: "Prove the recording, screen capture, editing, upload, and review process.",
        tasks: [
          "Record first Android phone talking-to-camera test.",
          "Record first screen capture.",
          "Test microphone or phone audio.",
          "Test computer editing workflow.",
          "Test Android-to-computer file transfer.",
          "Test backup process.",
          "Create thumbnail template.",
          "Create description template.",
          "Create pinned comment template.",
          "Create Shorts cutdown process.",
          "Publish first video.",
          "Review first video after 24 hours.",
          "Review first video after 7 days."
        ]
      },
      {
        title: "Phase 3: Growth Milestones",
        description: "Track subscriber targets and when to increase bridge content.",
        tasks: [
          "Reach 100 subscribers.",
          "Review which topics convert subscribers.",
          "Reach 500 subscribers.",
          "Check early YPP/fan funding eligibility requirements.",
          "Reach 1,000 subscribers.",
          "Check watch hours and Shorts views, but do not apply automatically.",
          "Reach 5,000 subscribers.",
          "Increase building-the-channel-in-public content.",
          "Reach 10,000 subscribers.",
          "Introduce regular Siberian project preparation updates.",
          "Reach 25,000 subscribers.",
          "Prepare the land/build content transition.",
          "Reach 50,000 subscribers.",
          "Begin MCN/YPP setup and main project transition."
        ]
      },
      {
        title: "Phase 4: Siberian Project Transition",
        description: "Move from beginner YouTube education toward the build documentary.",
        tasks: [
          "Publish a clear transition video.",
          "Explain why editing tutorials led into the Siberian build.",
          "Poll audience about build topics.",
          "Start documenting land/build preparation without exposing exact location.",
          "Start documenting tool and filming preparation.",
          "Create build season roadmap.",
          "Decide first real build task.",
          "Draft first land/preparation episode.",
          "Draft first structure decision episode.",
          "Draft banya planning episode.",
          "Draft cabin planning episode.",
          "Draft main house planning episode."
        ]
      },
      {
        title: "Phase 5: Monetization Research",
        description: "Research YPP, MCNs, withholding, country routes, and payout assumptions.",
        tasks: [
          "Re-check current YouTube Partner Program thresholds before applying.",
          "Re-check any February 1, 2027 YPP changes if applying after that date.",
          "Build a monetization table from MONETIZATION_CURRICULUM.md.",
          "Draft a beginner explanation of YPP tiers.",
          "Draft a beginner explanation of direct AdSense.",
          "Draft a beginner explanation of MCNs.",
          "Draft a beginner explanation of U.S. withholding tax.",
          "Draft a beginner explanation of treaty-rate withholding.",
          "Draft a correction explaining that 10% vs 30% is tax withholding, not YouTube commission.",
          "Draft a country/route comparison framework without giving tax advice.",
          "Treat MCN as likely route unless new information changes this.",
          "Confirm whether direct AdSense route is possible as a backup.",
          "List possible MCNs.",
          "Check whether each MCN is currently active and reputable.",
          "Check MCN payout routes.",
          "Ask each MCN about Kazakhstan bank payouts.",
          "Ask each MCN what ID documents they require.",
          "Ask each MCN about fees.",
          "Ask each MCN about contract term and exit clause.",
          "Ask each MCN about Content ID control.",
          "Compare direct route vs MCN route.",
          "Choose monetization route.",
          "Apply around 50k subscribers only after the payout path is clear, unless the strategy changes."
        ]
      },
      {
        title: "Phase 6: Ongoing Review",
        description: "Keep the system alive after launch.",
        tasks: [
          "Review analytics weekly.",
          "Update top-performing topic list.",
          "Update weak-performing topic list.",
          "Save good viewer questions.",
          "Turn strong comments into future video ideas.",
          "Refresh the 12-video pipeline every month.",
          "Review monetization requirements every quarter.",
          "Review MCN options every quarter until signed."
        ]
      }
    ];

    let state = loadState();
    let filter = "all";

    const sectionsEl = document.getElementById("sections");
    const emptyEl = document.getElementById("empty");
    const searchEl = document.getElementById("search");
    const progressBar = document.getElementById("progressBar");
    const doneCount = document.getElementById("doneCount");
    const openCount = document.getElementById("openCount");
    const totalCount = document.getElementById("totalCount");
    const percentCount = document.getElementById("percentCount");

    function idFor(sectionIndex, taskIndex, task) {
      return `${sectionIndex + 1}.${taskIndex + 1}-${task.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}`;
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { tasks: {}, notes: {}, collapsed: {} };
      } catch {
        return { tasks: {}, notes: {}, collapsed: {} };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();
      sectionsEl.innerHTML = "";
      let visibleItems = 0;

      checklist.forEach((section, sectionIndex) => {
        const sectionId = `section-${sectionIndex}`;
        const sectionTaskData = section.tasks.map((task, taskIndex) => {
          const id = idFor(sectionIndex, taskIndex, task);
          return {
            id,
            task,
            done: Boolean(state.tasks[id]),
            note: state.notes[id] || "",
            taskIndex
          };
        });

        const filteredTasks = sectionTaskData.filter(item => {
          const haystack = `${section.title} ${section.description} ${item.task} ${item.note}`.toLowerCase();
          const matchesSearch = !query || haystack.includes(query);
          const matchesFilter = filter === "all" || (filter === "done" && item.done) || (filter === "open" && !item.done);
          return matchesSearch && matchesFilter;
        });

        if (!filteredTasks.length) return;
        visibleItems += filteredTasks.length;

        const completedInSection = sectionTaskData.filter(item => item.done).length;
        const sectionEl = document.createElement("section");
        sectionEl.id = sectionId;

        const head = document.createElement("button");
        head.type = "button";
        head.className = "section-head";
        head.setAttribute("aria-expanded", String(!state.collapsed[sectionId]));
        head.innerHTML = `
          <span class="section-title">
            <strong>${escapeHtml(section.title)}</strong>
            <span>${escapeHtml(section.description)}</span>
          </span>
          <span class="section-count">${completedInSection}/${section.tasks.length}</span>
        `;
        head.addEventListener("click", () => {
          state.collapsed[sectionId] = !state.collapsed[sectionId];
          saveState();
          render();
        });

        const itemsEl = document.createElement("div");
        itemsEl.className = "items";
        if (state.collapsed[sectionId]) itemsEl.classList.add("hidden");

        filteredTasks.forEach(item => {
          const row = document.createElement("div");
          row.className = `item${item.done ? " done" : ""}`;
          row.dataset.id = item.id;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.done;
          checkbox.setAttribute("aria-label", item.task);
          checkbox.addEventListener("change", () => {
            state.tasks[item.id] = checkbox.checked;
            saveState();
            render();
          });

          const main = document.createElement("div");
          main.className = "task-main";
          const text = document.createElement("div");
          text.className = "task-text";
          text.textContent = item.task;

          const note = document.createElement("textarea");
          note.value = item.note;
          note.placeholder = "Notes, links, next action...";
          note.addEventListener("input", () => {
            state.notes[item.id] = note.value;
            saveState();
          });

          main.append(text, note);

          const tag = document.createElement("div");
          tag.className = "tag";
          tag.textContent = item.id.split("-")[0];

          row.append(checkbox, main, tag);
          itemsEl.append(row);
        });

        sectionEl.append(head, itemsEl);
        sectionsEl.append(sectionEl);
      });

      emptyEl.classList.toggle("hidden", visibleItems !== 0);
      updateSummary();
    }

    function updateSummary() {
      const all = [];
      checklist.forEach((section, sectionIndex) => {
        section.tasks.forEach((task, taskIndex) => {
          all.push(idFor(sectionIndex, taskIndex, task));
        });
      });
      const done = all.filter(id => state.tasks[id]).length;
      const total = all.length;
      const percent = total ? Math.round((done / total) * 100) : 0;
      doneCount.textContent = done;
      openCount.textContent = total - done;
      totalCount.textContent = total;
      percentCount.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function exportProgress() {
      const payload = {
        exportedAt: new Date().toISOString(),
        app: "Crazy Aussie Checklist",
        version: 1,
        state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "crazy-aussie-checklist-progress.json";
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function importProgress(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          const incoming = payload.state || payload;
          if (!incoming.tasks || !incoming.notes) throw new Error("Missing checklist data");
          state = {
            tasks: incoming.tasks || {},
            notes: incoming.notes || {},
            collapsed: incoming.collapsed || {}
          };
          saveState();
          render();
        } catch (error) {
          alert(`Could not import progress: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(btn => {
          btn.setAttribute("aria-pressed", String(btn === button));
        });
        render();
      });
    });

    searchEl.addEventListener("input", render);
    document.getElementById("exportBtn").addEventListener("click", exportProgress);
    document.getElementById("importFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) importProgress(file);
      event.target.value = "";
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Reset all saved checklist progress and notes in this browser?")) return;
      state = { tasks: {}, notes: {}, collapsed: {} };
      saveState();
      render();
    });

    let scrollTimer;
    window.addEventListener("scroll", () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => localStorage.setItem(SCROLL_KEY, String(window.scrollY)), 120);
    });

    render();
    const savedScroll = Number(localStorage.getItem(SCROLL_KEY) || 0);
    if (savedScroll > 0) requestAnimationFrame(() => window.scrollTo(0, savedScroll));
  </script>
</body>
</html>
